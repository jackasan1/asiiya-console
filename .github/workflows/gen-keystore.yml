name: Generate Keystore (one-off)

on:
  workflow_dispatch:
    inputs:
      password:
        description: keystore password
        required: true

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias dsh \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=DSH Console, O=jackasan1"
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
